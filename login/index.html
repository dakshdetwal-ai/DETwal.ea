
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">
  <title>Login | DETwal</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>
  <header class="topbar">
    <a href="../home/" class="brand" aria-label="DETwal home">
      <span class="secured">SECURED BY</span>
      <span class="brand-name">DET<span class="gold">wal</span></span>
    </a>

    <a href="../home/" class="back-link">← Home</a>
  </header>

  <main class="auth-layout">
    <section class="auth-card">
      <div class="security-icon">✦</div>

      <p class="eyebrow">WELCOME BACK</p>
      <h1>Login to DETwal</h1>
      <p class="subtitle">
        Sign in to access your account and trading tools.
      </p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            maxlength="128"
            required
          >
        </div>

        <div class="forgot-row">
          <a href="./forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">
          Login to Account <span>→</span>
        </button>

        <p
          id="formMessage"
          class="form-message"
          role="status"
          aria-live="polite"
        ></p>
      </form>

      <div class="separator"><span>OR</span></div>

      <p class="login-prompt">
        Don't have an account?
        <a href="../signup/">Create account</a>
      </p>

      <p class="security-note">
        <span>◆</span> Your account security matters to us.
      </p>
    </section>
  </main>

  <footer>
    © <span id="year"></span> DETwal. All rights reserved.
    <p>Trading involves risk. Returns are not guaranteed.</p>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    document.getElementById("loginForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        const message = document.getElementById("formMessage");

        if (!event.currentTarget.reportValidity()) return;

        message.textContent =
          "Login is not connected yet. Secure authentication will be enabled after the backend is configured.";

        message.className = "form-message info";
      }
    );
  </script>
</body>
</html>
